name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::notice::No zip file yet. Upload your project zip to the main page of this repository."
            exit 0
          fi
          echo "Unpacking: $ZIP"
          rm -rf _project
          mkdir _project
          unzip -oq "$ZIP" -d _project
          FOUND=$(find _project -maxdepth 3 -name settings.gradle.kts | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "::error::This zip does not contain an Android project (settings.gradle.kts is missing)."
            exit 1
          fi
          echo "BUILD_DIR=$(dirname "$FOUND")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: ${{ env.BUILD_DIR != '' }}
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ env.BUILD_DIR != '' }}
        with:
          gradle-version: 8.7

      - name: Build debug APK
        if: ${{ env.BUILD_DIR != '' }}
        working-directory: ${{ env.BUILD_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Publish APK as a release
        if: ${{ env.BUILD_DIR != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Data Saver build ${{ github.run_number }}
          files: ${{ env.BUILD_DIR }}/app/build/outputs/apk/debug/app-debug.apk
